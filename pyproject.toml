[project]
name = "jev-jarvis"
version = "0.6.2"
description = "聊天消息意图识别悬浮窗：API 判断意图与风险，生成回复候选（macOS）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pyobjc-framework-applicationservices>=12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa>=12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-vision>=12.2.2; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Intel/API installs never resolve these as active install requirements.
local = [
    "huggingface-hub>=1.32.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "laya>=0.3.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch>=2.14.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "transformers>=5.17.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
